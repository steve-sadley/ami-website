# The ami-dynamics-sync Worker, deployed by .github/workflows/deploy.yml on
# every push to main that changes this folder.
#
# Taken from the Worker as it ran in Cloudflare on 22 November 2026.
#
# Secrets are deliberately NOT here: the seven secrets stay in the dashboard
# and are never in this repository. A deploy keeps them (--keep-vars).
name = "ami-dynamics-sync"
main = "worker.js"
compatibility_date = "2026-10-31"

# Three times each weekday, in UTC: 07:20, 12:20 and 17:20 (an hour later in
# summer time). Days are named, not numbered: Cloudflare counts Sunday as 1, so
# the dashboard's old "1-5" ran Sunday to Thursday and missed Friday.
# This list now owns the schedule. Never leave it empty: that removes it.
[triggers]
crons = ["20 7,12,17 * * MON-FRI"]
